<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>손맛 낚시 🎣</title>
<style>
  :root{
    --bg:#061428;
    --panel:#0c223f;
    --accent:#5ee0ff;
    --gold:#ffd166;
    --text:#eaf6ff;
    --dim:#7fa3c4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    min-height:100vh;
  }
  #app{ max-width:900px; margin:0 auto; padding:16px; }
  header{ text-align:center; padding:10px 0; }
  header h1{
    margin:0 0 6px; font-size:24px;
    background:linear-gradient(90deg,var(--accent),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{ margin:0; color:var(--dim); font-size:13px; }

  .stage{
    position:relative; width:100%; aspect-ratio:4/3; max-height:72vh;
    background:#000; border-radius:16px; overflow:hidden;
    border:1px solid #133a5e; margin:14px auto 0;
  }
  #video{ display:none; }
  #game{ position:absolute; inset:0; width:100%; height:100%; }
  #camPreview{
    position:absolute; bottom:10px; right:10px; width:110px; height:82px;
    border-radius:10px; overflow:hidden; border:2px solid var(--accent);
    opacity:.9; box-shadow:0 0 12px rgba(94,224,255,.4);
  }
  #camPreview video{ display:block; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }

  #hud{
    position:absolute; top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:14px; font-weight:700; pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  #hud .chip{
    background:rgba(6,20,40,.55); padding:6px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.15);
  }

  #overlayMsg{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; background:rgba(6,20,40,.78); gap:14px; padding:20px;
  }
  #overlayMsg h2{ margin:0; font-size:22px; }
  #overlayMsg p{ margin:0; color:var(--dim); font-size:14px; max-width:360px; }

  .btn{
    background:linear-gradient(90deg,var(--accent),var(--gold)); color:#06172b; font-weight:800;
    border:none; padding:11px 22px; border-radius:12px; font-size:15px; cursor:pointer;
  }
  .btn.secondary{
    background:#0c223f; color:var(--text); border:1px solid #1c4a76; font-weight:600;
  }

  #status{
    margin-top:10px; text-align:center; font-size:13px; color:var(--dim); min-height:18px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎣 손맛 낚시</h1>
    <p>검지 손가락으로 물고기를 노렸다가, 물면(!) 엄지-검지를 재빨리 핀치해서 낚아채세요</p>
  </header>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="game"></canvas>
    <div id="camPreview"><video id="miniVideo" playsinline muted></video></div>

    <div id="hud" style="display:none;">
      <span class="chip">🐟 <span id="scoreVal">0</span></span>
      <span class="chip">⏱ <span id="timeVal">60</span>초</span>
    </div>

    <div id="overlayMsg">
      <h2>카메라를 켜고 낚시를 시작해봐</h2>
      <p>손이 화면에 잘 보이게 카메라를 향해주세요. 검지 끝이 낚싯바늘이 돼요.</p>
      <button class="btn" id="startBtn">카메라 켜고 시작</button>
    </div>
  </div>

  <div id="status">카메라를 켜면 안내가 여기 표시돼요.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script>
(function(){
  const video = document.getElementById('video');
  const miniVideo = document.getElementById('miniVideo');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const overlayMsg = document.getElementById('overlayMsg');
  const hud = document.getElementById('hud');
  const scoreVal = document.getElementById('scoreVal');
  const timeVal = document.getElementById('timeVal');

  let W = 0, H = 0;
  function resize(){
    const rect = canvas.getBoundingClientRect();
    W = canvas.width = rect.width;
    H = canvas.height = rect.height;
  }
  window.addEventListener('resize', resize);

  function mx(x){ return 1 - x; } // 미러 보정

  // ---------- 게임 상태 ----------
  let score = 0;
  let timeLeft = 60;
  let running = false;
  let fishes = [];
  let hook = { x: 0.5, y: 0.5 };
  let activeBite = null; // { fishId, startTime, window }
  let lastPinch = false;
  let bubbleTexts = []; // 점수 팝업 텍스트 애니메이션
  let timerId = null;
  let nextFishId = 1;

  function waterTop(){ return H * 0.22; }

  function spawnFish(){
    const golden = Math.random() < 0.12;
    const y = waterTop() + Math.random() * (H - waterTop() - 40) + 20;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const baseSpeed = 0.6 + Math.min(score, 20) * 0.03;
    fishes.push({
      id: nextFishId++,
      x: dir === 1 ? -30 : W + 30,
      y,
      dir,
      speed: (baseSpeed + Math.random()*0.6) * dir,
      size: golden ? 16 : (18 + Math.random()*10),
      golden,
      state: 'swim' // swim | biting | caught | escaped
    });
  }

  function resetGame(){
    score = 0; timeLeft = 60; fishes = []; activeBite = null; bubbleTexts = [];
    scoreVal.textContent = '0';
    timeVal.textContent = '60';
    for(let i=0;i<4;i++) spawnFish();
  }

  function startRound(){
    resetGame();
    running = true;
    hud.style.display = 'flex';
    overlayMsg.style.display = 'none';
    clearInterval(timerId);
    timerId = setInterval(()=>{
      timeLeft--;
      timeVal.textContent = timeLeft;
      if(timeLeft <= 0){
        endRound();
      }
    }, 1000);
  }

  function endRound(){
    running = false;
    clearInterval(timerId);
    overlayMsg.innerHTML = `
      <h2>🎣 종료! 이번 판 ${score}마리</h2>
      <p>다시 도전해서 기록을 깨보자.</p>
      <button class="btn" id="restartBtn">다시 시작</button>
    `;
    overlayMsg.style.display = 'flex';
    document.getElementById('restartBtn').addEventListener('click', startRound);
  }

  document.getElementById('startBtn').addEventListener('click', async ()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
      video.srcObject = stream;
      miniVideo.srcObject = stream;
      await video.play();
      await miniVideo.play();
      resize();
      statusEl.textContent = '카메라 연결됨! 손을 비춰서 물고기를 노려봐.';
      startHandTracking();
      startRound();
    }catch(err){
      statusEl.textContent = '카메라를 열 수 없어요: ' + err.message;
    }
  });

  // ---------- MediaPipe Hands ----------
  const hands = new Hands({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  hands.onResults(onResults);

  let camera = null;
  function startHandTracking(){
    if(camera) return;
    camera = new Camera(video, {
      onFrame: async ()=>{ await hands.send({image: video}); },
      width:640, height:480
    });
    camera.start();
  }

  let handVisible = false;
  function onResults(results){
    const hasHand = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
    handVisible = hasHand;
    if(!hasHand) return;
    const lm = results.multiHandLandmarks[0];
    const indexTip = lm[8];
    const thumbTip = lm[4];

    hook.x = mx(indexTip.x);
    hook.y = indexTip.y;

    const dx = mx(thumbTip.x) - mx(indexTip.x);
    const dy = thumbTip.y - indexTip.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const pinchedNow = dist < 0.06;

    // 핀치 "막 눌린 순간"만 캐치 시도로 인정
    if(pinchedNow && !lastPinch){
      tryCatch();
    }
    lastPinch = pinchedNow;
  }

  function tryCatch(){
    if(!activeBite) return;
    const fish = fishes.find(f => f.id === activeBite.fishId);
    if(!fish || fish.state !== 'biting') return;
    const elapsed = performance.now() - activeBite.startTime;
    if(elapsed <= activeBite.window){
      fish.state = 'caught';
      const gain = fish.golden ? 3 : 1;
      score += gain;
      scoreVal.textContent = score;
      bubbleTexts.push({
        x: fish.x, y: fish.y, life: 1,
        text: fish.golden ? `✨금붕어! +${gain}` : `잡았다! +${gain}`
      });
      statusEl.textContent = fish.golden ? '✨ 금붕어 낚시 성공! 반응 최고!' : '🐟 낚시 성공!';
      activeBite = null;
      setTimeout(()=>{
        fishes = fishes.filter(f => f.id !== fish.id);
        spawnFish();
      }, 250);
    }
  }

  // ---------- 게임 루프 ----------
  function update(dt){
    if(!running) return;

    // 물고기 이동
    fishes.forEach(f=>{
      if(f.state === 'swim' || f.state === 'biting'){
        f.x += f.speed * dt * 60;
      }
    });

    // 화면 밖으로 완전히 나가면 도망 처리 후 리스폰
    fishes = fishes.filter(f=>{
      const out = f.x < -60 || f.x > W + 60;
      if(out && f.state !== 'caught'){
        if(activeBite && activeBite.fishId === f.id) activeBite = null;
        return false;
      }
      return f.state !== 'caught' ? true : true;
    });
    while(fishes.length < 4) spawnFish();

    // 바늘-물고기 충돌 → 물기 시작
    if(!activeBite && handVisible){
      const hx = hook.x * W, hy = hook.y * H;
      for(const f of fishes){
        if(f.state !== 'swim') continue;
        const d = Math.hypot(hx - f.x, hy - f.y);
        if(d < f.size + 14){
          f.state = 'biting';
          activeBite = { fishId: f.id, startTime: performance.now(), window: f.golden ? 550 : 900 };
          statusEl.textContent = f.golden ? '✨ 금붕어가 물었다! 빨리 핀치!' : '🐟 물었다! 핀치로 낚아채!';
          break;
        }
      }
    }

    // 물기 시간 초과 → 도망
    if(activeBite){
      const fish = fishes.find(f=>f.id===activeBite.fishId);
      const elapsed = performance.now() - activeBite.startTime;
      if(!fish || elapsed > activeBite.window){
        if(fish) fish.state = 'swim';
        activeBite = null;
        statusEl.textContent = '아쉽다, 놓쳤어! 다음 기회에.';
      }
    }

    bubbleTexts.forEach(b=>{ b.y -= 30*dt; b.life -= dt*0.9; });
    bubbleTexts = bubbleTexts.filter(b=>b.life>0);
  }

  function drawFish(f){
    const bodyColor = f.golden ? '#ffd166' : (f.state==='biting' ? '#ff8fa3' : '#5ee0ff');
    ctx.save();
    ctx.translate(f.x, f.y);
    if(f.dir < 0) ctx.scale(-1,1);
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(0,0,f.size,f.size*0.6,0,0,Math.PI*2);
    ctx.fill();
    // 꼬리
    ctx.beginPath();
    ctx.moveTo(-f.size,0);
    ctx.lineTo(-f.size-10,-8);
    ctx.lineTo(-f.size-10,8);
    ctx.closePath();
    ctx.fill();
    // 눈
    ctx.fillStyle = '#06172b';
    ctx.beginPath();
    ctx.arc(f.size*0.45,-3,2.4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    if(f.state === 'biting'){
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('!', f.x, f.y - f.size - 14);
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // 하늘
    const skyGrad = ctx.createLinearGradient(0,0,0,waterTop());
    skyGrad.addColorStop(0,'#0a2647');
    skyGrad.addColorStop(1,'#123a63');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,waterTop());

    // 물
    const waterGrad = ctx.createLinearGradient(0,waterTop(),0,H);
    waterGrad.addColorStop(0,'#0e3a63');
    waterGrad.addColorStop(1,'#031425');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0,waterTop(),W,H-waterTop());

    // 수면선
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, waterTop());
    ctx.lineTo(W, waterTop());
    ctx.stroke();

    fishes.forEach(drawFish);

    // 낚싯줄 + 바늘
    if(handVisible){
      const hx = hook.x*W, hy = hook.y*H;
      ctx.strokeStyle = 'rgba(255,255,255,.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hx, 0);
      ctx.lineTo(hx, hy);
      ctx.stroke();

      ctx.fillStyle = activeBite ? '#ff5f6d' : '#eaf6ff';
      ctx.beginPath();
      ctx.arc(hx, hy, 8, 0, Math.PI*2);
      ctx.fill();
    }

    // 점수 팝업
    bubbleTexts.forEach(b=>{
      ctx.globalAlpha = Math.max(0,b.life);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.text, b.x, b.y);
      ctx.globalAlpha = 1;
    });
  }

  let lastT = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
