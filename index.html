<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>친구 우물 낚시 🪣</title>
<style>
  :root{
    --bg:#080b16; --panel:#121a2e; --accent:#5ee0ff; --gold:#ffd166;
    --text:#eaf6ff; --dim:#7fa3c4; --release:#8fd0ff; --keep:#ffb454;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif; min-height:100vh; }
  #app{ max-width:1000px; margin:0 auto; padding:16px; }
  header{ text-align:center; padding:10px 0; }
  header h1{ margin:0 0 6px; font-size:23px;
    background:linear-gradient(90deg,var(--accent),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:0; color:var(--dim); font-size:13px; }
  .stage{ position:relative; width:100%; aspect-ratio:1/1.15; max-height:84vh;
    background:#2b6b34;
    border-radius:16px; overflow:hidden; border:1px solid #17233d; margin:14px auto 0; }
  #video{ display:none; }
  #game{ position:absolute; inset:0; width:100%; height:100%; }
  #camPreview{ position:absolute; bottom:10px; right:10px; width:100px; height:76px;
    border-radius:10px; overflow:hidden; border:2px solid var(--accent); opacity:.9;
    box-shadow:0 0 12px rgba(94,224,255,.4); z-index:5; }
  #camPreview video{ display:block; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #hud{ position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between;
    align-items:center; font-size:13px; font-weight:700; pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,.6); z-index:5; }
  #hud .chip{ background:rgba(6,20,40,.55); padding:6px 11px; border-radius:999px; border:1px solid rgba(255,255,255,.15); }
  #overlayMsg{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; background:rgba(6,20,40,.82); gap:14px; padding:20px; z-index:10; }
  #overlayMsg h2{ margin:0; font-size:21px; }
  #overlayMsg p{ margin:0; color:var(--dim); font-size:13px; max-width:360px; }
  .btn{ background:linear-gradient(90deg,var(--accent),var(--gold)); color:#06172b; font-weight:800;
    border:none; padding:11px 22px; border-radius:12px; font-size:15px; cursor:pointer; }
  #choiceRow{ position:absolute; left:0; right:0; bottom:18px; display:none; justify-content:center; gap:14px; z-index:8; }
  #choiceRow button{ border:none; border-radius:14px; padding:12px 20px; font-size:14px; font-weight:800; cursor:pointer; }
  #releaseBtn{ background:rgba(143,208,255,.15); color:var(--release); border:2px solid var(--release) !important; }
  #keepBtn{ background:rgba(255,180,84,.18); color:var(--keep); border:2px solid var(--keep) !important; }
  #status{ margin-top:10px; text-align:center; font-size:13px; color:var(--dim); min-height:18px; }
  #collectionRow{ margin-top:8px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; min-height:30px; }
  #collectionRow img{ width:30px; height:30px; border-radius:6px; object-fit:cover; border:1.5px solid var(--gold); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🪣 친구 우물 낚시</h1>
    <p>줄이 파르르 떨리면(입질!) 손을 위로 확 당겨서 챔질하세요. 낚이면 스와이프(또는 버튼)로 놓아주거나 담아두세요.</p>
  </header>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="game"></canvas>
    <div id="camPreview"><video id="miniVideo" playsinline muted></video></div>

    <div id="hud" style="display:none;">
      <span class="chip">🧺 담음 <span id="keepVal">0</span></span>
      <span class="chip">⏱ <span id="timeVal">90</span>초</span>
      <span class="chip">↩️ 놓아줌 <span id="releaseVal">0</span></span>
    </div>

    <div id="choiceRow">
      <button id="releaseBtn">◀ 놓아주기</button>
      <button id="keepBtn">담아두기 ▶</button>
    </div>

    <div id="overlayMsg">
      <h2>우물에 손짓으로 낚시를 드리워봐</h2>
      <p>카메라를 켜고, 줄이 떨릴 때 손을 위로 확 당기는 동작(챔질)을 해보세요.</p>
      <button class="btn" id="startBtn">카메라 켜고 시작</button>
    </div>
  </div>

  <div id="status">카메라를 켜면 안내가 여기 표시돼요.</div>
  <div id="collectionRow"></div>
</div>

(function(){
  const video = document.getElementById('video');
  const miniVideo = document.getElementById('miniVideo');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const overlayMsg = document.getElementById('overlayMsg');
  const hud = document.getElementById('hud');
  const keepVal = document.getElementById('keepVal');
  const releaseVal = document.getElementById('releaseVal');
  const timeVal = document.getElementById('timeVal');
  const choiceRow = document.getElementById('choiceRow');
  const collectionRow = document.getElementById('collectionRow');

  const friendImgs = FRIEND_IMAGES.map(src=>{ const im = new Image(); im.src = src; return im; });

  let W=0,H=0;
  function resize(){ const rect = canvas.getBoundingClientRect(); W=canvas.width=rect.width; H=canvas.height=rect.height; buildGrassLayer(); }
  window.addEventListener('resize', resize);
  function mx(x){ return 1-x; }

  // ---------- 오디오 ----------
  let audioCtx=null;
  function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  function tone(freq, t0, dur, type='sine', vol=0.22){
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type=type; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }
  function playBiteSound(){ ensureAudio(); const now=audioCtx.currentTime; tone(200,now,0.08,'square',0.12); tone(240,now+0.1,0.08,'square',0.12); }
  function playHookSound(){ ensureAudio(); const now=audioCtx.currentTime; [520,780,1040].forEach((f,i)=>tone(f, now+i*0.06, 0.18,'sine',0.2)); }
  function playTugSound(){ ensureAudio(); const now=audioCtx.currentTime; tone(140, now, 0.12, 'square', 0.18); }
  function playImpactSound(){ ensureAudio(); const now=audioCtx.currentTime; [440,660,880,1174].forEach((f,i)=>tone(f, now+i*0.05, 0.22,'sine',0.24)); tone(90, now, 0.2, 'triangle', 0.2); }
  function playMissSound(){ ensureAudio(); const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type='sawtooth'; osc.frequency.setValueAtTime(280,now); osc.frequency.exponentialRampToValueAtTime(110,now+0.3);
    gain.gain.setValueAtTime(0.15,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.3);
    osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now+0.32);
  }
  function playKeepSound(){ ensureAudio(); const now=audioCtx.currentTime; [660,880,1108,1318].forEach((f,i)=>tone(f, now+i*0.06, 0.2,'sine',0.22)); }
  function playReleaseSound(){ ensureAudio(); const now=audioCtx.currentTime; [700,500,350].forEach((f,i)=>tone(f, now+i*0.07, 0.15,'sine',0.15)); }

  // ---------- 상태 ----------
  let keepCount=0, releaseCount=0, timeLeft=90, running=false, roundEnding=false;
  let timerId=null;
  let gameState='idle'; // idle | biting | revealing | choosing
  let nextBiteAt=0, biteStart=0;
  const BITE_WINDOW=1700;
  let bobberShakeSeed=0;
  let wristHist=[]; // for pull & swipe gestures
  let handVisible=false, currentWrist={x:.5,y:.5};

  let revealPhase = 'grow'; // grow | impact | done
  let growStart = 0, impactStart = 0;
  const GROW_DURATION = 1300, IMPACT_DURATION = 260;
  const TOTAL_TURNS = 3;
  let currentResultIdx = 0;
  let popups = [];
  let choiceResolved = true;

  function vibrate(pattern){ if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} } }
  const stageEl = document.getElementById('stage');
  function shakeStage(duration, intensity){
    const start = performance.now();
    function step(now){
      const t = (now-start)/duration;
      if(t>=1){ stageEl.style.transform=''; return; }
      const dx = (Math.random()*2-1)*intensity*(1-t);
      const dy = (Math.random()*2-1)*intensity*(1-t);
      stageEl.style.transform = `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`;
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function easeOutBack(t){ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

  let grassLayer = null;
  function buildGrassLayer(){
    const off = document.createElement('canvas'); off.width=Math.max(1,W); off.height=Math.max(1,H);
    const g = off.getContext('2d');
    const grad = g.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#4fae52'); grad.addColorStop(1,'#2b6b34');
    g.fillStyle = grad; g.fillRect(0,0,W,H);
    for(let i=0;i<220;i++){
      const x = Math.random()*W, y = Math.random()*H;
      const len = 6+Math.random()*8;
      const lean = (Math.random()*8-4);
      g.strokeStyle = Math.random()<0.5 ? 'rgba(20,70,25,.55)' : 'rgba(140,220,140,.35)';
      g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+lean, y-len); g.stroke();
    }
    grassLayer = off;
  }

  function wellGeom(){
    const cx = W/2, cy = H*0.52;
    const r = Math.min(W,H)*0.40;
    return {cx,cy,r};
  }

  function resetGame(){
    keepCount=0; releaseCount=0; timeLeft=90; roundEnding=false;
    keepVal.textContent='0'; releaseVal.textContent='0'; timeVal.textContent='90';
    collectionRow.innerHTML='';
    gameState='idle';
    nextBiteAt = performance.now() + 1200;
    choiceRow.style.display='none';
    popups = [];
  }

  function startRound(){
    resetGame(); running=true;
    hud.style.display='flex'; overlayMsg.style.display='none';
    clearInterval(timerId);
    timerId = setInterval(()=>{
      timeLeft--; timeVal.textContent = Math.max(0,timeLeft);
      if(timeLeft<=0) roundEnding = true;
    },1000);
  }

  function endRound(){
    running=false; clearInterval(timerId);
    overlayMsg.innerHTML = `
      <h2>🪣 종료! 담아둔 친구 ${keepCount}명</h2>
      <p>놓아준 친구 ${releaseCount}명. 다시 도전해볼까?</p>
      <button class="btn" id="restartBtn">다시 시작</button>
    `;
    overlayMsg.style.display='flex';
    document.getElementById('restartBtn').addEventListener('click', startRound);
  }

  document.getElementById('startBtn').addEventListener('click', async ()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
      video.srcObject = stream; miniVideo.srcObject = stream;
      await video.play(); await miniVideo.play();
      resize();
      statusEl.textContent = '카메라 연결됨! 줄이 떨릴 때까지 기다려봐.';
      startHandTracking();
      startRound();
    }catch(err){
      statusEl.textContent = '카메라를 열 수 없어요: ' + err.message;
    }
  });

  const hands = new Hands({ locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  hands.onResults(onResults);

  let camera=null;
  function startHandTracking(){
    if(camera) return;
    camera = new Camera(video, { onFrame: async ()=>{ await hands.send({image:video}); }, width:640, height:480 });
    camera.start();
  }

  function onResults(results){
    const hasHand = results.multiHandLandmarks && results.multiHandLandmarks.length>0;
    handVisible = hasHand;
    if(!hasHand) return;
    const lm = results.multiHandLandmarks[0];
    const wrist = lm[0];
    currentWrist = { x: mx(wrist.x), y: wrist.y };
    const now = performance.now();
    wristHist.push({x:currentWrist.x, y:currentWrist.y, t:now});
    wristHist = wristHist.filter(p => now-p.t < 450);

    if(gameState==='biting'){
      checkPullGesture(now);
    } else if(gameState==='choosing'){
      checkSwipeChoice(now);
    }
  }

  let lastPullCheck=0;
  function checkPullGesture(now){
    if(wristHist.length<2) return;
    const first = wristHist[0];
    const dy = first.y - currentWrist.y; // 양수면 위로 이동(당김)
    if(dy > 0.13){
      hookSuccess();
    }
  }

  let lastSwipeCheck=0;
  function checkSwipeChoice(now){
    if(choiceResolved) return;
    if(wristHist.length<2) return;
    if(now - lastSwipeCheck < 500) return;
    const first = wristHist[0];
    const dx = currentWrist.x - first.x;
    if(dx > 0.16){ lastSwipeCheck=now; resolveChoice(true); }
    else if(dx < -0.16){ lastSwipeCheck=now; resolveChoice(false); }
  }

  function hookSuccess(){
    vibrate([25,35,70]);
    shakeStage(180,4);
    playTugSound();
    gameState='revealing';
    revealPhase='grow';
    growStart = performance.now();
    currentResultIdx = Math.floor(Math.random()*friendImgs.length);
    statusEl.textContent = '손맛 좋다... 뭐가 올라오는 거지?!';
  }

  function resolveChoice(keep){
    if(choiceResolved) return;
    choiceResolved = true;
    choiceRow.style.display='none';
    if(keep){
      keepCount++; keepVal.textContent=keepCount;
      playKeepSound();
      statusEl.textContent = '🧺 담았다!';
      popups.push({x:W/2,y:H*0.3,life:1,text:'담았다! +1'});
      const im = document.createElement('img');
      im.src = FRIEND_IMAGES[currentResultIdx];
      collectionRow.appendChild(im);
    } else {
      releaseCount++; releaseVal.textContent=releaseCount;
      playReleaseSound();
      statusEl.textContent = '↩️ 다시 놓아줬다.';
      popups.push({x:W/2,y:H*0.3,life:1,text:'놓아줬다'});
    }
    gameState='idle';
    nextBiteAt = performance.now() + 1200 + Math.random()*1800;
  }

  document.getElementById('releaseBtn').addEventListener('click', ()=>resolveChoice(false));
  document.getElementById('keepBtn').addEventListener('click', ()=>resolveChoice(true));

  // ---------- 업데이트 ----------
  function update(dt){
    if(!running) return;
    const now = performance.now();

    if(gameState==='idle'){
      if(roundEnding){ endRound(); return; }
      if(now >= nextBiteAt){
        gameState='biting';
        biteStart = now;
        wristHist = [];
        playBiteSound();
        statusEl.textContent = '😲 입질이다! 손을 위로 확 당겨!';
      }
    } else if(gameState==='biting'){
      if(now - biteStart > BITE_WINDOW){
        gameState='idle';
        playMissSound();
        statusEl.textContent = '아쉽다, 줄이 잠잠해졌어...';
        nextBiteAt = now + 1000 + Math.random()*2000;
      }
    } else if(gameState==='revealing'){
      if(revealPhase==='grow'){
        const t = Math.min(1, (now-growStart)/GROW_DURATION);
        if(t>=1){
          revealPhase='impact';
          impactStart = now;
          vibrate(90);
          shakeStage(320,9);
          playImpactSound();
        }
      } else if(revealPhase==='impact'){
        const t = Math.min(1, (now-impactStart)/IMPACT_DURATION);
        if(t>=1){
          revealPhase='done';
          gameState='choosing';
          choiceResolved=false;
          choiceRow.style.display='flex';
          wristHist=[];
          statusEl.textContent = '스와이프(왼쪽=놓아주기, 오른쪽=담아두기) 또는 버튼을 눌러줘.';
        }
      }
    }

    popups.forEach(p=>{ p.y -= 26*dt; p.life -= dt*0.8; });
    popups = popups.filter(p=>p.life>0);
  }

  // ---------- 드로우 ----------
  function drawWell(){
    const {cx,cy,r} = wellGeom();
    // 배경 잔디
    if(grassLayer) ctx.drawImage(grassLayer,0,0);

    // 우물 테두리(돌, 밝은 톤)
    const rimGrad = ctx.createRadialGradient(cx,cy,r*0.78,cx,cy,r*1.22);
    rimGrad.addColorStop(0,'#e7dcc4'); rimGrad.addColorStop(1,'#a9906a');
    ctx.fillStyle = rimGrad;
    ctx.beginPath(); ctx.arc(cx,cy,r*1.22,0,Math.PI*2); ctx.fill();
    // 벽돌 느낌 점선
    ctx.strokeStyle='rgba(120,95,60,.35)'; ctx.lineWidth=2;
    for(let i=1;i<=2;i++){ ctx.beginPath(); ctx.arc(cx,cy,r*(1.0+0.07*i),0,Math.PI*2); ctx.stroke(); }

    // 하늘색 물
    const waterGrad = ctx.createRadialGradient(cx,cy,4,cx,cy,r);
    waterGrad.addColorStop(0,'#bdf1ff');
    waterGrad.addColorStop(0.55,'#5fd0f0');
    waterGrad.addColorStop(1,'#1f8fc4');
    ctx.fillStyle = waterGrad;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    // 잔물결
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
    for(let i=1;i<=3;i++){ ctx.beginPath(); ctx.arc(cx,cy,r*(0.3*i),0,Math.PI*2); ctx.stroke(); }
    // 하이라이트
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.35, cy-r*0.4, r*0.18, r*0.08, -0.4, 0, Math.PI*2); ctx.fill();
  }

  function drawLine(){
    const {cx,cy,r} = wellGeom();
    const anchorX = cx, anchorY = 0;
    let bobX = cx, bobY = cy - r*0.05;
    if(gameState==='biting'){
      const t = (performance.now()-biteStart)/1000;
      const amp = Math.min(14, 4 + t*18);
      bobX += Math.sin(t*40)*amp;
      bobY += Math.cos(t*33)*amp*0.35;
    } else if(gameState==='idle'){
      const t = performance.now()/1000;
      bobY += Math.sin(t*1.4)*3;
    }
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(anchorX,anchorY); ctx.lineTo(bobX,bobY); ctx.stroke();
    ctx.fillStyle = gameState==='biting' ? '#ff5f6d' : '#eaf6ff';
    ctx.beginPath(); ctx.arc(bobX,bobY,7,0,Math.PI*2); ctx.fill();
    if(gameState==='biting'){
      ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
      ctx.fillText('!', bobX, bobY-16);
    }
  }

  function clippedImage(img, x, y, size){
    ctx.save();
    ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2); ctx.closePath(); ctx.clip();
    if(img.complete && img.naturalWidth>0){
      ctx.drawImage(img, x-size, y-size, size*2, size*2);
    } else {
      ctx.fillStyle='#2a3a55'; ctx.fillRect(x-size,y-size,size*2,size*2);
    }
    ctx.restore();
  }

  function roundRectPath(x,y,w,h,radius){
    ctx.beginPath();
    ctx.moveTo(x+radius,y);
    ctx.arcTo(x+w,y,x+w,y+h,radius);
    ctx.arcTo(x+w,y+h,x,y+h,radius);
    ctx.arcTo(x,y+h,x,y,radius);
    ctx.arcTo(x,y,x+w,y,radius);
    ctx.closePath();
  }

  function clippedImageOrigin(img, size){
    const w=size*2, h=size*2, x=-size, y=-size, radius=size*0.16;
    ctx.save();
    roundRectPath(x,y,w,h,radius);
    ctx.clip();
    if(img.complete && img.naturalWidth>0){
      ctx.drawImage(img, x,y,w,h);
    } else {
      ctx.fillStyle='#2a3a55'; ctx.fillRect(x,y,w,h);
    }
    ctx.restore();
  }

  function drawReveal(){
    const {cx,cy,r} = wellGeom();
    const fullSize = r*0.62;
    const img = friendImgs[currentResultIdx];

    let t, rot, sc, flashAlpha=0;
    if(revealPhase==='grow'){
      t = Math.min(1, (performance.now()-growStart)/GROW_DURATION);
      rot = TOTAL_TURNS*2*Math.PI*easeOutCubic(t);
      sc = 0.1 + 0.9*easeOutBack(t);
    } else {
      t = 1; rot = 0; sc = 1;
      const it = Math.min(1, (performance.now()-impactStart)/IMPACT_DURATION);
      flashAlpha = 1-it;
    }
    const size = fullSize*Math.max(0.05, sc);

    // 후광 (커질수록 진해짐)
    const haloA = 0.5*Math.min(1, t*1.4);
    const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,size*1.7);
    grad.addColorStop(0, `rgba(255,209,102,${haloA})`);
    grad.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx,cy,size*1.7,0,Math.PI*2); ctx.fill();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot);
    clippedImageOrigin(img, size);
    ctx.strokeStyle='rgba(255,209,102,.95)'; ctx.lineWidth=4;
    roundRectPath(-size,-size,size*2,size*2,size*0.16); ctx.stroke();
    ctx.restore();

    if(revealPhase==='impact' && flashAlpha>0){
      ctx.save();
      ctx.globalAlpha = flashAlpha*0.8;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx,cy,fullSize*1.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
      if(flashAlpha>0.5){
        ctx.save();
        ctx.globalAlpha = flashAlpha;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('따단!', cx, cy - fullSize - 18);
        ctx.restore();
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawWell();
    if(gameState==='revealing' || gameState==='choosing'){
      drawReveal();
    } else {
      drawLine();
    }
    popups.forEach(p=>{
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = '#ffd166'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    });
  }

  let lastT = performance.now();
  function loop(now){
    const dt = Math.min(0.05,(now-lastT)/1000);
    lastT = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  resize();
  requestAnimationFrame(loop);
})();
</script>
